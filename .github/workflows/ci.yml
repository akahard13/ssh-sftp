name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      - name: Build web + CLI
        run: npm run build:web

      - name: Build escritorio
        run: npm run build

      - name: Contenido del paquete npm
        run: npm pack --dry-run
